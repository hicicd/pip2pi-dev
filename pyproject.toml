[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pip2pi-dev"
description = "pip2pi builds a PyPI-compatible package repository from pip requirements"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "xsmq", email = "hwxsmq@gmail.com" },
    { name = "David Wolever", email = "david@wolever.net" }
]
maintainers = [
    { name = "xsmq", email = "hwxsmq@gmail.com" },
    { name = "Md Safiyat Reza", email = "safiyat@voereir.com" }
]
keywords = [
    "pypi",
    "mirror",
    "offline",
    "package index",
    "pip",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    # pip is run as a subprocess by the pip2tgz and pip2pi commands.
    "pip>=10.0.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/hicicd/pip2pi-dev"

[project.scripts]
dir2pi = "libpip2pi.commands:dir2pi"
pip2pi = "libpip2pi.commands:pip2pi"
pip2tgz = "libpip2pi.commands:pip2tgz"

[tool.setuptools]
packages = ["libpip2pi"]

[tool.setuptools.dynamic]
# libpip2pi.__version__ is a (major, minor, patch) tuple; setuptools joins
# iterable values with dots, so (0, 9, 1) becomes "0.9.1".
version = { attr = "libpip2pi.__version__" }
